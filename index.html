<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Todd Homes LLC — Sign In</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --red:       #c8102e;
  --red-dark:  #a00d24;
  --red-light: #fdf0f2;
  --red-mid:   #f5c2cb;
  --black:     #111111;
  --black2:    #1e1e1e;
  --white:     #ffffff;
  --off-white: #f8f8f8;
  --border:    #e0e0e0;
  --border2:   #cccccc;
  --muted:     #888888;
  --text:      #1e1e1e;
  --green:     #1a7a3e;
}

body {
  background: var(--off-white);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
  overflow: hidden;
}

/* Diagonal stripe background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    -45deg,
    transparent,
    transparent 40px,
    rgba(200,16,46,.03) 40px,
    rgba(200,16,46,.03) 41px
  );
  pointer-events: none;
}

/* Red top bar */
body::after {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 5px;
  background: var(--red);
}

.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 4px;
  width: 100%;
  max-width: 400px;
  position: relative;
  box-shadow: 0 8px 40px rgba(0,0,0,.1), 0 2px 8px rgba(0,0,0,.06);
  overflow: hidden;
}

/* Red left accent bar */
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: 4px;
  background: var(--red);
}

.card-header {
  background: var(--black);
  padding: 32px 36px 28px;
  text-align: center;
}

.brand-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2.8rem;
  color: var(--white);
  letter-spacing: 4px;
  line-height: 1;
}
.brand-logo span { color: var(--red); }

.brand-sub {
  font-size: .6rem;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgba(255,255,255,.4);
  margin-top: 6px;
}

.card-body { padding: 32px 36px 36px; }

.form-title {
  font-size: .65rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.form-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: .62rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
  font-weight: 600;
}
.field input {
  width: 100%;
  background: var(--off-white);
  border: 1.5px solid var(--border);
  border-radius: 3px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: .92rem;
  padding: 11px 13px;
  transition: border-color .18s, box-shadow .18s;
  outline: none;
}
.field input:focus {
  border-color: var(--red);
  background: var(--white);
  box-shadow: 0 0 0 3px rgba(200,16,46,.08);
}
.field input::placeholder { color: #bbb; }

.pw-wrap { position: relative; }
.pw-wrap input { padding-right: 52px; }
.pw-toggle {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: .72rem;
  font-weight: 600;
  letter-spacing: .5px;
  text-transform: uppercase;
  padding: 4px;
  transition: color .15s;
}
.pw-toggle:hover { color: var(--red); }

.btn-submit {
  width: 100%;
  background: var(--red);
  border: none;
  border-radius: 3px;
  color: var(--white);
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: .85rem;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 14px;
  margin-top: 8px;
  transition: background .16s, transform .1s, box-shadow .16s;
}
.btn-submit:hover {
  background: var(--red-dark);
  box-shadow: 0 4px 16px rgba(200,16,46,.25);
}
.btn-submit:active { transform: scale(.98); }
.btn-submit:disabled { opacity: .6; cursor: not-allowed; transform: none; }

.spinner {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .6s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.msg {
  margin-top: 12px;
  padding: 10px 13px;
  border-radius: 3px;
  font-size: .8rem;
  display: none;
}
.msg.error { background: var(--red-light); border: 1px solid var(--red-mid); color: var(--red-dark); display: block; }
.msg.success { background: #e8f5ee; border: 1px solid #a3d4b5; color: var(--green); display: block; }

.footer-note {
  text-align: center;
  margin-top: 20px;
  font-size: .65rem;
  color: #bbb;
  letter-spacing: .5px;
}

/* ── LOGGED IN STATE ── */
.logged-in-card { display: none; }

.logged-in-card .card-body { padding: 32px 36px 36px; }

.greeting {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.8rem;
  letter-spacing: 2px;
  color: var(--black);
  line-height: 1;
  margin-bottom: 4px;
}
.greeting span { color: var(--red); }
.user-email { font-size: .75rem; color: var(--muted); margin-bottom: 24px; }

.nav-buttons { display: flex; flex-direction: column; gap: 10px; }
.nav-btn {
  display: block;
  border: 1.5px solid var(--border);
  border-radius: 3px;
  padding: 14px 18px;
  text-decoration: none;
  transition: all .16s;
  position: relative;
  overflow: hidden;
}
.nav-btn::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--red);
  transform: scaleY(0);
  transition: transform .16s;
}
.nav-btn:hover { border-color: var(--red); background: var(--red-light); }
.nav-btn:hover::before { transform: scaleY(1); }
.nav-btn-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.1rem;
  letter-spacing: 2px;
  color: var(--black);
}
.nav-btn-desc { font-size: .72rem; color: var(--muted); margin-top: 2px; }

.btn-logout {
  width: 100%;
  background: transparent;
  border: 1.5px solid var(--border);
  border-radius: 3px;
  color: var(--muted);
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: .76rem;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 10px;
  margin-top: 16px;
  transition: all .15s;
}
.btn-logout:hover { border-color: var(--red); color: var(--red); background: var(--red-light); }

@media (max-width: 480px) {
  .card-header { padding: 24px 24px 20px; }
  .card-body { padding: 24px 24px 28px; }
  .brand-logo { font-size: 2.4rem; }
}

.brand-logo-img {
  height: 64px;
  width: auto;
  object-fit: contain;
  display: block;
  margin: 0 auto 8px;
}
.brand-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5rem;
  color: var(--white);
  letter-spacing: 3px;
  line-height: 1;
}
.brand-name span { color: var(--red); }
</style>
</head>
<body>

<!-- LOGIN CARD -->
<div class="card" id="loginCard">
  <div class="card-header">
    <img src="https://selectionsbuilderandrewcoleman.netlify.app/Toddlogo.png" alt="Todd Homes LLC" class="brand-logo-img" onerror="this.style.display='none'"/>
    <div class="brand-name">Todd <span>Homes</span> LLC</div>
    <div class="brand-sub">Selection Management System</div>
  </div>
  <div class="card-body">
    <div class="form-title">Staff Sign In</div>
    <div class="field">
      <label>Email Address</label>
      <input type="email" id="emailInput" placeholder="your@email.com" autocomplete="email"/>
    </div>
    <div class="field">
      <label>Password</label>
      <div class="pw-wrap">
        <input type="password" id="passInput" placeholder="••••••••" autocomplete="current-password"/>
        <button class="pw-toggle" type="button" onclick="togglePw()" id="pwToggle">Show</button>
      </div>
    </div>
    <button class="btn-submit" id="submitBtn" onclick="signIn()">Sign In</button>
    <div class="msg" id="msg"></div>
    <div class="footer-note">Access restricted to authorized staff only</div>
  </div>
</div>

<!-- LOGGED IN CARD -->
<div class="card logged-in-card" id="loggedInCard">
  <div class="card-header">
    <img src="https://selectionsbuilderandrewcoleman.netlify.app/Toddlogo.png" alt="Todd Homes LLC" class="brand-logo-img" onerror="this.style.display='none'"/>
    <div class="brand-name">Todd <span>Homes</span> LLC</div>
    <div class="brand-sub">Selection Management System</div>
  </div>
  <div class="card-body">
    <div class="greeting">Welcome, <span id="greetName">—</span></div>
    <div class="user-email" id="userEmail"></div>
    <div class="nav-buttons">
      <a href="PackageBuilder.html" class="nav-btn">
        <div class="nav-btn-title">Package Builder</div>
        <div class="nav-btn-desc">Create and manage master selection files</div>
      </a>
      <a href="SelectionPage.html" class="nav-btn">
        <div class="nav-btn-title">Selection Page</div>
        <div class="nav-btn-desc">Walk through selections with a customer</div>
      </a>
    </div>
    <button class="btn-logout" onclick="signOut()">Sign Out</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://skbkwjqpbhuuwxpxbmhn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrYmt3anFwYmh1dXd4cHhibWhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1OTU2NTUsImV4cCI6MjA5MzE3MTY1NX0.OoWqErkV8ri-F2g1ze0SHvM9DackPYHAD0RCJ65RsQA';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) showLoggedIn(session.user);
}

async function signIn() {
  const email = document.getElementById('emailInput').value.trim().toLowerCase();
  const pass  = document.getElementById('passInput').value;
  const btn   = document.getElementById('submitBtn');

  clearMsg();
  if (!email || !pass) { showMsg('Please enter your email and password.', 'error'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Signing in…';

  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });

  if (error) {
    showMsg('Incorrect email or password. Please try again.', 'error');
    resetBtn(); return;
  }

  showLoggedIn(data.user);
  resetBtn();
}

async function signOut() {
  await sb.auth.signOut();
  document.getElementById('loggedInCard').style.display = 'none';
  document.getElementById('loginCard').style.display = 'block';
  document.getElementById('emailInput').value = '';
  document.getElementById('passInput').value = '';
  clearMsg();
}

function showLoggedIn(user) {
  document.getElementById('loginCard').style.display = 'none';
  document.getElementById('loggedInCard').style.display = 'block';
  document.getElementById('userEmail').textContent = user.email;
  const name = user.email.split('@')[0];
  document.getElementById('greetName').textContent = name.charAt(0).toUpperCase() + name.slice(1);
}

function showMsg(text, type) {
  const msg = document.getElementById('msg');
  msg.textContent = text;
  msg.className = 'msg ' + type;
}
function clearMsg() {
  const msg = document.getElementById('msg');
  msg.className = 'msg';
  msg.textContent = '';
}
function resetBtn() {
  const btn = document.getElementById('submitBtn');
  btn.disabled = false;
  btn.innerHTML = 'Sign In';
}
function togglePw() {
  const input = document.getElementById('passInput');
  const toggle = document.getElementById('pwToggle');
  const hidden = input.type === 'password';
  input.type = hidden ? 'text' : 'password';
  toggle.textContent = hidden ? 'Hide' : 'Show';
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') signIn(); });
checkSession();
</script>
</body>
</html>
